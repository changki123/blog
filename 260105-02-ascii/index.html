  .video-wrapper {
    background: #000;
    text-align: center;
    padding: 20px;
  }
  #ascii-output {
    font-size: 6px;
    line-height: 3px;
    background: #000;
    color: #0f0;
    font-family: monospace;
    white-space: pre;
    overflow-x: auto;
    letter-spacing: 0;
  }
</style>
<div class="video-wrapper">
  <video id="sourceVideo" width="640" height="360" autoplay loop muted>
    <source src="/blog/video/sample.mp4" type="video/mp4">
  </video>
  <div id="ascii-output"></div>
</div>
<script>
(function() {
  const video = document.getElementById('sourceVideo');
  const output = document.getElementById('ascii-output');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  
  // 16:9 비율
  canvas.width = 160;
  canvas.height = 90;
  
  const chars = ' .:-=+*#%@';
  
  function convert() {
    if (!video.paused && !video.ended) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let ascii = '';
      
      for (let i = 0; i < imgData.data.length; i += 4) {
        const avg = (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
        const charIdx = Math.floor(avg / 255 * (chars.length - 1));
        ascii += chars[charIdx];
        if ((i/4 + 1) % canvas.width === 0) ascii += '\n';
      }
      
      output.textContent = ascii;
      requestAnimationFrame(convert);
    }
  }
  
  video.addEventListener('playing', convert);
})();
</script>
