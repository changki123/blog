<aside class="sidebar">
    <div class="sidebar-section">
        <h3>📌 태그</h3>
        <div class="tags-widget" id="tags-widget">
            {% set tags_taxonomy = get_taxonomy(kind="tags") %}
            {% if tags_taxonomy %}
                {% for term in tags_taxonomy.items | sort(attribute="name") %}
                    <a href="{{ term.permalink }}" class="tag-link">
                        <span class="tag-name">#{{ term.name }}</span>
                        <span class="tag-count">({{ term.pages | length }})</span>
                    </a>
                {% endfor %}
            {% endif %}
        </div>
        <button id="toggle-tags" class="toggle-button">더보기 ▼</button>
    </div>
</aside>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tagsWidget = document.getElementById('tags-widget');
    const toggleButton = document.getElementById('toggle-tags');
    const tags = tagsWidget.querySelectorAll('.tag-link');
    const showCount = 8; // 처음에 보여줄 태그 개수
    
    // 태그가 적으면 버튼 숨기기
    if (tags.length <= showCount) {
        toggleButton.style.display = 'none';
        return;
    }
    
    // 처음에 일부만 보이기
    tags.forEach((tag, index) => {
        if (index >= showCount) {
            tag.style.display = 'none';
        }
    });
    
    // 버튼 클릭 이벤트
    let isExpanded = false;
    toggleButton.addEventListener('click', function() {
        isExpanded = !isExpanded;
        
        tags.forEach((tag, index) => {
            if (index >= showCount) {
                tag.style.display = isExpanded ? 'flex' : 'none';
            }
        });
        
        toggleButton.textContent = isExpanded ? '접기 ▲' : '더보기 ▼';
    });
});
</script>
